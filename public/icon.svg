<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Store Awning and Building Icon -->
  <g filter="url(#shadow)" transform="translate(64, 64) scale(0.75)">
    <!-- Store Front Roof -->
    <path d="M60 160 L452 160 L420 80 L92 80 Z" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M60 160 Q95 210 130 160 Q165 210 200 160 Q235 210 270 160 Q305 210 340 160 Q375 210 410 160 Q435 200 452 160" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>

    <!-- Stripes -->
    <path d="M120 80 L100 160" stroke="#2563eb" stroke-width="14"/>
    <path d="M190 80 L180 160" stroke="#2563eb" stroke-width="14"/>
    <path d="M260 80 L260 160" stroke="#2563eb" stroke-width="14"/>
    <path d="M330 80 L340 160" stroke="#2563eb" stroke-width="14"/>
    <path d="M400 80 L420 160" stroke="#2563eb" stroke-width="14"/>

    <!-- Shop Body Card -->
    <rect x="80" y="180" width="352" height="240" rx="24" fill="#ffffff"/>

    <!-- Shopping / POS Receipt Element -->
    <rect x="130" y="220" width="120" height="150" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="6"/>
    <line x1="150" y1="250" x2="220" y2="250" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
    <line x1="150" y1="280" x2="200" y2="280" stroke="#93c5fd" stroke-width="6" stroke-linecap="round"/>
    <line x1="150" y1="310" x2="230" y2="310" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>

    <!-- Cash Register / POS Screen -->
    <rect x="280" y="230" width="110" height="90" rx="12" fill="url(#bg)"/>
    <circle cx="335" cy="275" r="20" fill="#ffffff" fill-opacity="0.9"/>
    <path d="M335 263 L335 287 M325 275 L345 275" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
    <rect x="310" y="320" width="50" height="20" rx="4" fill="#64748b"/>
    <rect x="290" y="340" width="90" height="14" rx="4" fill="#94a3b8"/>
  </g>

  <!-- Sparkle Badge -->
  <g transform="translate(380, 70)">
    <circle cx="20" cy="20" r="32" fill="#10b981"/>
    <path d="M20 6 L23 15 L32 17 L25 24 L27 33 L20 28 L13 33 L15 24 L8 17 L17 15 Z" fill="#ffffff"/>
  </g>
</svg>
